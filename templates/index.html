<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منصة متابعة المرضى - الصندوق الطبي الذكي</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Tahoma, Arial, sans-serif;
    }
    body {
      margin: 0;
      padding: 24px;
      background-color: #f4f6f9;
      color: #1f2937;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    .card {
      background: #ffffff;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 24px;
    }
    h2 {
      margin: 0 0 14px 0;
      font-size: 18px;
    }
    .subtitle {
      margin: 0;
      color: #6b7280;
      font-size: 14px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      align-items: end;
    }
    input, select, button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 7px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }
    button {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .toolbar-left {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .toolbar-left select {
      width: 240px;
    }
    .toolbar-left button {
      width: auto;
      padding: 10px 18px;
    }
    .msg {
      margin-top: 10px;
      font-size: 13px;
      min-height: 18px;
    }
    .msg.ok {
      color: #15803d;
    }
    .msg.err {
      color: #b91c1c;
    }
    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
      white-space: nowrap;
    }
    th {
      background-color: #f9fafb;
      font-weight: bold;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      background-color: #e5e7eb;
      color: #1f2937;
    }
    .badge.NORMAL {
      background-color: #dcfce7;
      color: #166534;
    }
    .badge.HIGH_TEMP, .badge.FALL {
      background-color: #fee2e2;
      color: #991b1b;
    }
    .empty-cell {
      padding: 20px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>منصة متابعة المرضى</h1>
      <p class="subtitle">عرض القراءات الحيوية والبيئية الواردة من نظام الصندوق الطبي الذكي</p>
    </div>

    <div class="card">
      <h2>إضافة مريض جديد</h2>
      <form id="addPatientForm" class="form-grid">
        <div>
          <label for="patientName">اسم المريض</label>
          <input type="text" id="patientName" placeholder="مثال: أحمد علي" required />
        </div>
        <div>
          <label for="patientAge">العمر</label>
          <input type="number" id="patientAge" placeholder="مثال: 65" min="1" max="130" />
        </div>
        <div>
          <label for="patientNotes">ملاحظات طبية</label>
          <input type="text" id="patientNotes" placeholder="مثال: متابعة الحرارة والنبض" />
        </div>
        <div>
          <button type="submit">إضافة مريض</button>
        </div>
      </form>
      <div id="patientMsg" class="msg"></div>
    </div>

    <div class="card">
      <h2>سجل القراءات</h2>
      <div class="toolbar">
        <div class="toolbar-left">
          <label for="patientSelect">اختر المريض:</label>
          <select id="patientSelect"></select>
          <button type="button" id="refreshBtn">تحديث الآن</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>الوقت</th>
              <th>الحالة</th>
              <th>حرارة الجسم (NTC)</th>
              <th>حرارة الغرفة (DHT)</th>
              <th>الرطوبة (%)</th>
              <th>النبض (محاكاة)</th>
              <th>رصد سقوط</th>
            </tr>
          </thead>
          <tbody id="logsBody">
            <tr>
              <td colspan="7" class="empty-cell">لا توجد قراءات بعد</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const patientSelect = document.getElementById("patientSelect");
    const logsBody = document.getElementById("logsBody");
    const addPatientForm = document.getElementById("addPatientForm");
    const patientMsg = document.getElementById("patientMsg");
    const refreshBtn = document.getElementById("refreshBtn");

    function showMessage(text, isError = false) {
      patientMsg.textContent = text;
      patientMsg.className = `msg ${isError ? "err" : "ok"}`;
    }

    async function loadPatients(selectedId = null) {
      try {
        const res = await fetch("/api/patients");
        const patients = await res.json();
        patientSelect.innerHTML = "";

        patients.forEach(p => {
          const opt = document.createElement("option");
          opt.value = p.id;
          opt.textContent = `#${p.id} - ${p.name}` + (p.age ? ` (${p.age} سنة)` : "");
          patientSelect.appendChild(opt);
        });

        if (selectedId) {
          patientSelect.value = selectedId;
        }

        if (patientSelect.value) {
          loadTelemetry();
        }
      } catch (err) {
        showMessage("تعذر تحميل قائمة المرضى", true);
      }
    }

    async function loadTelemetry() {
      const pid = patientSelect.value;
      if (!pid) return;

      try {
        const res = await fetch(`/api/patients/${pid}/telemetry?limit=15`);
        const logs = await res.json();

        if (!logs.length) {
          logsBody.innerHTML = 
            <tr>
              <td colspan="7" class="empty-cell">لا توجد قراءات لهذا المريض بعد</td>
            </tr>
          ;
          return;
        }

        logsBody.innerHTML = logs.map(l => `
          <tr>
            <td>${(l.created_at || "").replace("T", " ").slice(0, 19)}</td>
            <td><span class="badge ${l.status || ""}">${l.status || "NORMAL"}</span></td>
            <td>${l.body_temp ?? "-"}</td>
            <td>${l.room_temp ?? "-"}</td>
            <td>${l.humidity ?? "-"}</td>
            <td>${l.pulse_sim ?? "-"}</td>
            <td>${l.fall_detected ? "نعم" : "لا"}</td>
          </tr>
        `).join("");
      } catch (err) {
        logsBody.innerHTML = 
          <tr>
            <td colspan="7" class="empty-cell">حدث خطأ أثناء جلب القراءات</td>
          </tr>
        ;
      }
    }

    addPatientForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("patientName").value.trim();
      const ageVal = document.getElementById("patientAge").value;
      const notes = document.getElementById("patientNotes").value.trim();

      if (!name) {
        showMessage("يرجى إدخال اسم المريض", true);
        return;
      }

      try {
        const res = await fetch("/api/patients", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name,
            age: ageVal ? Number(ageVal) : null,
            notes
          })
        });

        const data = await res.json();
        if (!res.ok) {
          showMessage(data.error || "تعذر إضافة المريض", true);
          return;
        }

        addPatientForm.reset();
        showMessage('تمت إضافة المريض "${data.name}" بنجاح');
        await loadPatients(data.id);
      } catch (err) {
        showMessage("حدث خطأ في الاتصال بالسيرفر", true);
      }
    });

    patientSelect.addEventListener("change", loadTelemetry);
    refreshBtn.addEventListener("click", loadTelemetry);
    loadPatients();
  </script>
</body>
</html>
